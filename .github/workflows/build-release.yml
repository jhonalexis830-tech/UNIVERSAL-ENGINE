name: Build & Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar (Windows x64 Release)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Compilar UE_Editor
        run: cmake --build build --config Release --parallel

      - name: Empaquetar ZIP portable
        run: powershell -ExecutionPolicy Bypass -File scripts/make_dist.ps1 -BuildDir build -Config Release

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: UniversalEngine-Editor
          path: dist/UniversalEngine-Editor-*.zip
          if-no-files-found: error

      - name: Publicar Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag dist/UniversalEngine-Editor-*.zip `
            --title "Universal Engine $tag" `
            --notes "Distribucion para Windows x64 (OpenGL 4.3+)."
        env:
          GH_TOKEN: ${{ github.token }}